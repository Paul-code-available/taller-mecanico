<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Resumen · Taller Mecánico</title>

    <meta property="og:title" content="Administrador de Taller Mecánico">
    <meta property="og:description" content="Sistema de administración para talleres mecánicos.">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Administrador de Taller Mecánico">
    <meta name="twitter:description" content="Sistema de administración para talleres mecánicos.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    >
    <link rel="stylesheet" href="css/styles.css">

    <body data-page="inicio">

        <div class="app">

            <aside class="sidebar" id="sidebar"></aside>

            <div class="main">

                <header class="topbar" id="topbar"></header>

                <main class="content">

                    <div class="head">
                        <h1>Resumen general</h1>
                        <a class="btn" href="pages/ordenes.html">
                            Ver órdenes
                        </a>
                    </div>

                    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

                    <div class="grid">

                        <section class="card tw" aria-labelledby="t1">

                            <h2 id="t1" style="padding:20px 20px 0">
                                Órdenes recientes
                            </h2>

                            <div id="tbl"></div>

                        </section>

                        <section class="card attn" aria-labelledby="t2">

                            <h2 id="t2">Requiere atención</h2>

                            <ul id="attn"></ul>

                        </section>

                    </div>

                </main>

            </div>

        </div>

        <div class="toast" id="toast" role="status"></div>

        <script src="app.js"></script>

        <script>
            const late = O.filter(o => o[5] === 'Retrasada');

            const kp = [
                [
                    'Órdenes activas',
                    O.filter(o => o[5] !== 'Completada').length
                ],
                [
                    'Órdenes retrasadas',
                    late.length,
                    'alert'
                ],
                [
                    'Vehículos en taller',
                    V.filter(v => v[6] === 'En taller').length
                ],
                [
                    'Ingresos completados',
                    money(
                        O.filter(o => o[5] === 'Completada')
                            .reduce((s, o) => s + o[7], 0)
                    )
                ]
            ];

            $('#kpis').innerHTML = kp.map(k => `
                <div class="card kpi ${k[2] || ''}">
                    <small>${k[0]}</small>
                    <strong>${k[1]}</strong>
                </div>
            `).join('');

            $('#attn').innerHTML = late.length
                ? late.map(o => `
                    <li>
                        <span>
                            <span class="id">${o[0]}</span>
                            ${badge(o[5])}
                        </span>

                        <span>${o[1]} · ${o[3]}</span>
                    </li>
                `).join('')
                : '<li>No hay órdenes retrasadas.</li>';

            list(
                $('#tbl'),
                COLS.ord.filter(c =>
                    ['Folio', 'Cliente', 'Estado', 'Total'].includes(c[0])
                ),
                O.slice(0, 5),
                5,
                null
            );
        </script>

    </body>
</html>
