<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador de Taller Mecánico</title>

    <meta
        name="description"
        content="Sistema de administración para talleres mecánicos que permite gestionar clientes, vehículos, citas, órdenes de trabajo, servicios, refacciones y pagos."
    >

    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <meta property="og:title" content="Administrador de Taller Mecánico">
    <meta
        property="og:description"
        content="Sistema de administración para talleres mecánicos."
    >
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Administrador de Taller Mecánico">
    <meta
        name="twitter:description"
        content="Sistema de administración para talleres mecánicos."
    >
</head>

<body>

    <div class="layout">

        <nav class="navbar">

            <div class="navbar__logo">

                <img
                    class="navbar__logo-image"
                    src="./assets/img/logo.png"
                    alt="Logo de la empresa"
                >

                <h2 class="navbar__logo-title">
                    Taller
                </h2>

            </div>

            <a class="navbar__link" href="#">
                Inicio
            </a>

            <a class="navbar__link" href="#">
                Clientes
            </a>

            <a class="navbar__link" href="#">
                Vehículos
            </a>

            <a class="navbar__link" href="#">
                Órdenes de trabajo
            </a>

            <a class="navbar__link" href="#">
                Mecánico
            </a>

            <a class="navbar__link" href="#">
                Servicios
            </a>

            <a class="navbar__link" href="#">
                Refacciones
            </a>

            <a class="navbar__link" href="#">
                Pagos
            </a>

            <a class="navbar__link" href="#">
                Reportes
            </a>

        </nav>


        <div class="layout__main">

            <header class="header">

                <input
                    class="header__search"
                    type="search"
                    placeholder="Buscar cliente, vehículo u orden..."
                >

                <div class="header__notifications">
                    Notificaciones
                </div>

                <div class="header__account">
                    Cuenta
                </div>

            </header>


            <main class="content">

                <h1 class="content__title">
                    Panel de administración
                </h1>

                <p class="content__date">
                    Fecha
                </p>

                <div class="content__grid">

                 

                </div>

            </main>

        </div>

    </div>

</body>
</html>
