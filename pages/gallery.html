<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <section class="gallery">

    <h2>Galería de imágenes</h2>

    <div class="gallery-grid">

        <figure class="gallery-item">
        <img
            src="/assets/img/carro.webp"
            alt="Servicios completos"
            width="800"
            height="450"
            loading="lazy"
        >
        <figcaption>Servicios completos</figcaption>
        </figure>

        <figure class="gallery-item">
        <img
            src="/assets/img/carros.webp"
            alt="Restauración de carros"
            width="800"
            height="450"
            loading="lazy"
        >
        <figcaption>Restauración de carros</figcaption>
        </figure>

        <figure class="gallery-item">
        <img
            src="/assets/img/motor-carro.webp"
            alt="Afinación de motor"
            width="800"
            height="450"
            loading="lazy"
        >
        <figcaption>Afinación de motor</figcaption>
        </figure>

        <figure class="gallery-item">
        <img
            src="/assets/img/bujias.webp"
            alt="Cambio de bujias"
            width="800"
            height="450"
            loading="lazy"
        >
        <figcaption>Cambio de bujias</figcaption>
        </figure>

    </div>
    </section>
    
</body>
</html>
