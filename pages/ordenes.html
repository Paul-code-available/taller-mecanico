<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Órdenes · Taller Mecánico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    >

    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('tema') || 'dark';
        } catch (e) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="ordenes">

    <div class="app">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="main">

            <header class="topbar" id="topbar"></header>

            <main class="content">

                <div class="head">
                    <h1>Órdenes de servicio</h1>
                    <button class="btn" id="nuevo">Nueva orden</button>
                </div>

                <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>

                <section class="card tw" aria-label="Tabla de órdenes">
                    <div id="tbl"></div>
                </section>

            </main>

        </div>

    </div>

    <div class="toast" id="toast" role="status"></div>

    <dialog id="modal-orden">

    <form id="form-nueva-orden" novalidate>

        <div class="campo">
            <label for="cliente">Cliente</label>

            <input
                id="cliente"
                name="cliente"
                type="text"
                required
                minlength="3"
                maxlength="60"
            >

            <span
                class="error-campo"
                data-error-para="cliente"
            ></span>
        </div>

        <div>
            <button type="submit">Agregar</button>
            <button type="button" id="cerrar">Cancelar</button>
        </div>

    </form>

    </dialog>
    <script src="../app.js"></script>

    <script>

        list($('#tbl'), COLS.ord, O, 5, $('#chips'));

       */

    <script type="module" src="../js/main.js"></script>

</body>
</html>
