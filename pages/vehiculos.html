<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Vehículos · Taller Mecánico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    >

    <script>
        try {
            const guardado = localStorage.getItem('tema');

            document.documentElement.dataset.theme =
                guardado === 'light' || guardado === 'dark'
                    ? guardado
                    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="vehiculos">

    <div class="app">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="main">

            <header class="topbar" id="topbar"></header>

            <main class="content">

                <div class="head">
                    <h1>Vehículos</h1>
                    <button class="btn" id="nuevo">Registrar vehículo</button>
                </div>

                <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>

                <section class="card tw" aria-label="Tabla de vehículos">
                    <div id="tbl"></div>
                </section>

            </main>

        </div>

    </div>

    <div class="toast" id="toast" role="status"></div>

    <dialog id="modal-vehiculo" aria-labelledby="titulo-vehiculo">

        <form id="form-nuevo-vehiculo" class="modal-form" novalidate>

            <h2 id="titulo-vehiculo">Registrar vehículo</h2>
            <p class="nota">Los datos se guardan en este navegador.</p>

            <div class="fila">
                <div class="campo">
                    <label for="placa">Placa</label>
                    <input id="placa" name="placa" type="text" required minlength="5" maxlength="10" pattern="[A-Za-z0-9\-]{5,10}" autocomplete="off" placeholder="BCS-421-A" style="text-transform:uppercase" aria-describedby="error-placa">
                    <span class="error-campo" id="error-placa" data-error-para="placa"></span>
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required aria-describedby="error-estado">
                        <option selected>En espera</option>
                        <option>En taller</option>
                    </select>
                    <span class="error-campo" id="error-estado" data-error-para="estado"></span>
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="vehiculo">Marca y modelo</label>
                    <input id="vehiculo" name="vehiculo" type="text" required minlength="3" maxlength="40" autocomplete="off" placeholder="Ej. Nissan Versa" aria-describedby="error-vehiculo">
                    <span class="error-campo" id="error-vehiculo" data-error-para="vehiculo"></span>
                </div>
                <div class="campo">
                    <label for="anio">Año</label>
                    <input id="anio" name="anio" type="number" required min="1980" max="2100" step="1" inputmode="numeric" placeholder="2019" aria-describedby="error-anio">
                    <span class="error-campo" id="error-anio" data-error-para="anio"></span>
                </div>
            </div>

            <div class="campo">
                <label for="cliente">Cliente</label>
                <input id="cliente" name="cliente" type="text" required minlength="3" maxlength="60" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ .'\-]+" autocomplete="off" placeholder="Nombre completo" aria-describedby="error-cliente">
                <span class="error-campo" id="error-cliente" data-error-para="cliente"></span>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="km">Kilometraje</label>
                    <input id="km" name="km" type="number" required min="0" max="999999" step="1" inputmode="numeric" placeholder="0" aria-describedby="error-km">
                    <span class="error-campo" id="error-km" data-error-para="km"></span>
                </div>
                <div class="campo">
                    <label for="ultimaVisita">Última visita</label>
                    <input id="ultimaVisita" name="ultimaVisita" type="date" required aria-describedby="error-ultimaVisita">
                    <span class="error-campo" id="error-ultimaVisita" data-error-para="ultimaVisita"></span>
                </div>
            </div>

            <div class="acciones">
                <button type="button" class="btn btn-sec" id="cerrar">Cancelar</button>
                <button type="submit" class="btn">Registrar vehículo</button>
            </div>

        </form>

    </dialog>

    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="../app.js"></script>

    <script>
        const tabla = list($('#tbl'), COLS.veh, cargarVehiculos, 'estado', $('#chips'));

        // vehiculos.js avisa cuando se guarda un vehículo nuevo
        document.addEventListener('vehiculos:cambio', tabla.recargar);
    </script>

    <script type="module" src="../js/vehiculos.js"></script>

</body>
</html>
